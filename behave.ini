# --------------------------------------------------------------------------------------------
# behave configuration for PyAssure (rarely edited). Behaviour switches live in app/config/pyassure.yml.
# --------------------------------------------------------------------------------------------
[behave]
paths = app/features

# Standard BDD report (branded) -> file; readable text -> console.
# Formats are paired with `outfiles` in order; formats without an outfile go to stdout.
format = html
         pretty
outfiles = reports/behave_report.html

# Excluded unless you pass --tags yourself:
#   @requires_creds    needs real Snowflake/Oracle/Databricks access
#   @requires_browser  Playwright UI scenarios (pip install playwright && playwright install chromium)
#   @demo_fail         fails ON PURPOSE to show how failures look in reports
default_tags = -@requires_creds
               -@requires_browser
               -@demo_fail

show_skipped = false
junit = true
junit_directory = reports/junit

[behave.formatters]
html = pyassure.reporting.bdd_html:BrandedHTMLFormatter
